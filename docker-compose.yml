services:
  web:
    image: ghcr.io/${GHCR_IMAGE}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-/movie-api/api}
    container_name: douban-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge-net

networks:
  edge-net:
    external: true
