services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TMDB_API_KEY: ${TMDB_API_KEY}
        NGINX_IMAGE: ${NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:alpine}
    container_name: douban-web
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge-net

networks:
  edge-net:
    external: true
